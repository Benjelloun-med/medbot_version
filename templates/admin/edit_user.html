{% extends "base.html" %}

{% block content %}
<div class="container mt-4" data-aos="flip-left"
data-aos-easing="ease-out-cubic"
data-aos-duration="2000">
    <h1>Modifier l'Utilisateur</h1>
    
    <form method="POST" class="mt-4">
        <div class="mb-3">
            <label for="name" class="form-label">Nom</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
        </div>
        
        <div class="mb-3">
            <label for="login" class="form-label">login</label>
            <input type="login" class="form-control" id="login" name="login" value="{{ user.login }}" required>
        </div>
        
        <div class="mb-3">
            <label for="password" class="form-label">Nouveau mot de passe (laisser vide pour ne pas changer)</label>
            <input type="password" class="form-control" id="password" name="password">
        </div>
        
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="is_admin" name="is_admin" {% if user.is_admin %}checked{% endif %}>
            <label class="form-check-label" for="is_admin">Administrateur</label>
        </div>
        
        <div class="mb-3">
            <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
